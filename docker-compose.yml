services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hajjmart}
      MYSQL_USER: ${MYSQL_USER:-hajjmart}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hajjmart}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hajjmart_root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - hajjmart_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  hajjmart_mysql_data:
